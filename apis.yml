aid: aichengtechnology
name: Aicheng Technology
description: >-
  Aicheng Technology (Suzhou Innovation Ceramic Technology Co., Ltd., "SiCT" —
  苏州艾成科技技术有限公司) is a Suzhou, China advanced-ceramics manufacturer founded in
  July 2021 that makes power-electronics substrates: AlN and Si3N4 ceramic
  substrates, DCB (direct copper bonding) and AMB (active metal brazing)
  substrates, DPC, and active solder/brazing pastes, for industrial control, new
  energy, consumer electronics and rail transport. It states it is the only
  Chinese manufacturer running the full "ceramic blank — copper bonding —
  etching — electroless plating" flow in mass production, with a factory and head
  office in the Suzhou High-Tech District and an R&D center in Korea. It sells
  physical components to hardware and semiconductor packaging customers; it
  operates no developer program, publishes no API, and its public site is a
  static corporate brochure with a product catalog, a datasheet download center,
  and a contact form.
